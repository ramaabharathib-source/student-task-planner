<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="tag">STUDY SMARTER</p>
      <h1>Student Task Planner</h1>
      <p class="intro">A simple place to organise your day, one task at a time.</p>
    </header>

    <section class="summary">
      <div><strong id="totalCount">0</strong><span>Total tasks</span></div>
      <div><strong id="doneCount">0</strong><span>Completed</span></div>
      <div><strong id="leftCount">0</strong><span>Remaining</span></div>
    </section>

    <form id="taskForm" class="add-form">
      <input id="taskInput" type="text" maxlength="90" placeholder="What do you need to do?" required>
      <select id="priorityInput" aria-label="Task priority">
        <option value="Normal">Normal</option>
        <option value="Important">Important</option>
        <option value="Urgent">Urgent</option>
      </select>
      <button type="submit">Add task</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Remaining</button>
      <button class="filter" data-filter="done">Completed</button>
    </nav>

    <section id="taskList" class="task-list" aria-live="polite"></section>
    <p class="footnote">Your tasks are saved in this browser on this device.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
